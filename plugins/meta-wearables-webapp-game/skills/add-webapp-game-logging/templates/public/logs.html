<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Game logs</title>
    <!--
      This page is DEVELOPER TOOLING, read on a laptop — not part of the game. It is deliberately
      exempt from the game's rules (no i18n, ordinary DOM event handlers), which is why the
      validators skip `public/`.

      The CSP is tight because this page renders text that arrived from a device over the public
      internet. Combined with the script's textContent-only rendering, a log line containing markup
      shows up as characters rather than executing. Keep both: they are the two halves of the same
      defense.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1d2026;
        --line: #2c3038;
        --text: #e6e8ea;
        --muted: #9aa0a6;
        --error: #ff6b6b;
        --warn: #ffd166;
        --info: #e6e8ea;
        --debug: #8ecae6;
        --trace: #9aa0a6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
      }
      h1 {
        font-size: 15px;
        margin: 0 12px 0 0;
        font-weight: 600;
      }
      select,
      input,
      button {
        background: #262a31;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px 9px;
        font: inherit;
        font-size: 13px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: #4a5058;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      #banner {
        padding: 8px 14px;
        background: #3a2f16;
        color: var(--warn);
        font-size: 12.5px;
        border-bottom: 1px solid var(--line);
      }
      #banner[hidden] {
        display: none;
      }
      #login {
        max-width: 420px;
        margin: 15vh auto;
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      #login p {
        color: var(--muted);
        font-size: 13px;
      }
      #login-row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      #login-token {
        flex: 1;
      }
      #login-error {
        color: var(--error);
        font-size: 13px;
        min-height: 19px;
        margin-top: 10px;
      }
      #log {
        margin: 0;
        padding: 8px 0;
        font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .row {
        display: grid;
        grid-template-columns: 88px 46px 110px 1fr;
        gap: 10px;
        padding: 2px 14px;
        white-space: pre-wrap;
        word-break: break-word;
        border-left: 3px solid transparent;
      }
      .row:hover {
        background: #1a1d22;
      }
      .row .time,
      .row .scope {
        color: var(--muted);
      }
      .row .level {
        font-weight: 700;
      }
      .row.error {
        border-left-color: var(--error);
      }
      .row.error .level,
      .row.error .message {
        color: var(--error);
      }
      .row.warn .level,
      .row.warn .message {
        color: var(--warn);
      }
      .row.debug .message {
        color: var(--debug);
      }
      .row.trace .message {
        color: var(--trace);
      }
      .row .data {
        grid-column: 4;
        color: var(--muted);
      }
      #empty {
        padding: 40px 14px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section id="login">
      <h1>Game logs</h1>
      <p>Enter the passcode for this deployment — the value of the <code>LOG_TOKEN</code> environment variable.</p>
      <div id="login-row">
        <input id="login-token" type="password" autocomplete="current-password" placeholder="Passcode" />
        <button id="login-submit" type="button">Sign in</button>
      </div>
      <div id="login-error" role="alert"></div>
    </section>

    <main id="app" hidden>
      <header>
        <h1>Game logs</h1>
        <select id="session-filter" title="Session"></select>
        <select id="level-filter" title="Minimum level">
          <option value="trace">trace+</option>
          <option value="debug">debug+</option>
          <option value="info">info+</option>
          <option value="warn">warn+</option>
          <option value="error">error only</option>
        </select>
        <button id="pause" type="button">Pause</button>
        <button id="clear" type="button">Clear view</button>
        <button id="download" type="button">Download JSONL</button>
        <button id="logout" type="button">Sign out</button>
        <span id="status"></span>
      </header>
      <div id="banner" hidden></div>
      <div id="log"></div>
      <div id="empty">
        No records yet. Open the game with <code>?log=debug&amp;logkey=&lt;token&gt;</code> and accept the consent screen.
      </div>
    </main>

    <script src="/logs.js"></script>
  </body>
</html>
